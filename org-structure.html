  const text=el.appendChild(document.createElement('div'));
  text.appendChild(document.createElement('strong')).textContent=item.title;
  for(const name of item.names||[]) text.appendChild(document.createElement('span')).textContent=name;
  if(item.budget){const amount=text.appendChild(document.createElement('span'));amount.className='budget';amount.textContent='Плановый ФОТ';const value=amount.appendChild(document.createElement('b'));value.className='budget-value';value.textContent=item.budget+(item.budget==='не утверждён'?'':' ₽ / мес.');}
  if(item.platonov && !['compare','platonov'].includes(new URLSearchParams(location.search).get('view'))) el.classList.add('new-staff');
  for(const slot of item.assignmentSlots||[]){
    const select=text.appendChild(document.createElement('select'));
    select.setAttribute('aria-label',item.title+' — назначение '+slot.number);
    assignmentInputs.push({slot,select});
  }
  if(item.retained) el.classList.add('retained');
  if(item.detail) text.appendChild(document.createElement('span')).textContent=item.detail.replace(/\s*·\s*4%\s*от оклада/gu,'');
  if(item.suggested) el.classList.add('proposed');
  if(item.proposal && el.classList.contains('card')){
    el.classList.add('proposed');
    const badge=text.appendChild(document.createElement('span'));badge.className='proposal';badge.textContent=item.proposal;
    const basis=text.appendChild(document.createElement('span'));
    if(item.source){const a=basis.appendChild(document.createElement('a'));a.href=item.source;a.textContent=item.basis;}
    else basis.textContent=item.basis;
  }
  return el;
}
function node(item, depth=0){
  const el=document.createElement('section');el.className='node';el.append(card(item,depth===0||Boolean(item.budget)));
  if(item.children?.length){
    const list=el.appendChild(document.createElement('div'));list.className='children';
    for(const child of item.children) list.append(node(child,depth+1));
  }
  return el;
}
const root=main.appendChild(card(data,true));root.classList.add('root');
const tree=main.appendChild(document.createElement('div'));tree.className='tree';
const [executive,production,accounting,hr,quality,safety]=data.children;
const groups=[executive,production,quality,accounting,hr,safety].map(item=>[item]);
const colors=['#8366a2','#468dbb','#c87860','#5a9c66','#b86691'];
const targets=groups.map((group,index)=>{
  const lane=tree.appendChild(document.createElement('div'));lane.className='lane';
  lane.style.setProperty('--tone',colors[index % colors.length]);
  for(const item of group)lane.append(node(item));
  return lane.firstElementChild.firstElementChild;
});
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('wires');svg.setAttribute('aria-hidden','true');tree.prepend(svg);
function wires(){
  const base=tree.getBoundingClientRect();
  svg.setAttribute('width',base.width);svg.setAttribute('height',base.height);
  const center=el=>{const b=el.getBoundingClientRect();return b.left+b.width/2-base.left;};
  const xs=targets.map(center), x=center(root), bus=34;
  const path=document.createElementNS(svg.namespaceURI,'path');
  path.setAttribute('d',`M ${x} 0 V ${bus} M ${xs[0]} ${bus} H ${xs.at(-1)} `+xs.map(v=>`M ${v} ${bus} V ${targets[0].getBoundingClientRect().top-base.top}`).join(' '));
  path.setAttribute('fill','none');path.setAttribute('stroke','#548487');path.setAttribute('stroke-width','2');svg.replaceChildren(path);
}
const mode=new URLSearchParams(location.search).get('view');
const controls=document.createElement('nav');controls.className='draft-controls';main.prepend(controls);
for(const [key,label] of [['','Основная штатка'],['platonov','Предложенная штатка'],['compare','Смешанная']]){
  const link=controls.appendChild(document.createElement('a'));link.href='?ui=relief2'+(key?'&view='+key:'');
  link.textContent=label;if((mode||'')===key)link.setAttribute('aria-current','page');
}
function element(parent,tag,value){
  const el=parent.appendChild(document.createElement(tag));el.textContent=value;return el;
}
const project=data.platonovDraft;
if(mode==='compare'||mode==='platonov'){
  tree.hidden=true;root.hidden=true;main.classList.add('view');
}
if(mode==='compare'){
  const ours=new Map(), counts=new Map(), assigned=new Set();
  const key=title=>title.toLowerCase().replace(/\s*,\s*/g,', ').replace(/\s+/g,' ').trim();
  function collect(item){
    if(item.names?.length){
      const id=key(item.title);
      ours.set(id,[...new Set([...(ours.get(id)||[]),...item.names])]);
    }
    for(const child of item.children||[])collect(child);
  }
  collect(data);
  const positions=[];
  function list(item,path=[]){
    const units=Number(item.detail?.match(/^([\d.]+) шт\. ед\./)?.[1]);
    if(Number.isFinite(units)){
      positions.push({item,path:path.join(' → '),units});
      const id=key(item.title);counts.set(id,(counts.get(id)||0)+1);
    }
    for(const child of item.children||[])list(child,[...path,item.title]);
  }
  for(const branch of project.children)list(branch);
  for(const {item,units} of positions){
    const id=key(item.title),people=ours.get(id)||[];
    if(!people.length)continue;
    if(counts.get(id)!==1||people.length>units)continue;
    item.names=people;
    item.retained=true;
    assigned.add(id);
  }
  const pending=document.createElement('section');
  pending.className='pending-staff';
  element(pending,'h2','Нераспределённые сотрудники');
  const table=pending.appendChild(document.createElement('table'));
  const head=table.createTHead().insertRow();
  for(const title of ['ФИО','Текущая должность'])element(head,'th',title);
  const body=table.createTBody();
  const entries=[];
  function pendingRows(item){
    if(!assigned.has(key(item.title)))for(const name of item.names||[])entries.push([name,item.title]);
    for(const child of item.children||[])pendingRows(child);
  }
  pendingRows(data);
  const matchedNames=new Set(positions.flatMap(({item})=>item.names||[]));
  const pool=[...new Set(entries.map(([name])=>name).filter(name=>!matchedNames.has(name)))].sort((a,b)=>a.localeCompare(b,'ru'));
  const occurrences=new Map();
  const slots=new Map();
  for(const {item,path,units} of positions){
    const base=path+' → '+item.title;
    const occurrence=(occurrences.get(base)||0)+1;
    occurrences.set(base,occurrence);
    item.assignmentSlots=Array.from({length:Math.max(0,Math.floor(units-(item.names?.length||0)))},(_,i)=>{
      const slot={id:JSON.stringify([base,occurrence,i]),number:i+1};
      slots.set(slot.id,slot);return slot;
    });
  }
  const storageKey='lab-staff-assignments-v1';
  let saved={};
  try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')||{};}catch{}
  const selected=new Map(),used=new Set();
  for(const [id,name] of Object.entries(saved)){
    if(!slots.has(id))continue;
    if(name==='__vacancy__')selected.set(id,name);
    else if(pool.includes(name)&&!used.has(name)){selected.set(id,name);used.add(name);}
  }
  const summary=main.appendChild(document.createElement('section'));
  summary.className='staff-counts';
  summary.setAttribute('aria-label','Итоги распределения');
  const counters=['Ставок в проекте','Людей в текущем штате','Ставок для ручного распределения','Ставок без решения','Отмечено вакансий','Людей ещё не распределено'].map(label=>{
    const card=element(summary,'div',label);
    return element(card,'strong','');
  });
  function refresh(){
    const vacancies=[...selected.values()].filter(value=>value==='__vacancy__').length;
    const staff=new Set([...ours.values()].flat());
    const values=[positions.reduce((sum,{units})=>sum+units,0),staff.size,slots.size,slots.size-selected.size,vacancies,pool.length-selected.size+vacancies];
    values.forEach((value,index)=>counters[index].textContent=value.toLocaleString('ru-RU'));
    const taken=new Set(selected.values());
    for(const {slot,select} of assignmentInputs){
      const current=selected.get(slot.id)||'';
      select.replaceChildren(new Option('Выбрать сотрудника',''),new Option('Вакансия','__vacancy__'));
      for(const name of pool)if(name===current||!taken.has(name))select.add(new Option(name,name));
      select.value=current;
      select.closest('.card').classList.toggle('retained',Boolean(select.closest('.card').querySelector('select option:checked:not([value=""]):not([value="__vacancy__"])'))||select.closest('.card').dataset.matched==='true');
    }
    body.replaceChildren();
    for(const [name,title] of entries.filter(([name])=>!taken.has(name)&&!matchedNames.has(name)).sort(([a],[b])=>a.localeCompare(b,'ru'))){
      const row=body.insertRow();element(row,'td',name);element(row,'td',title);
    }
    if(!body.rows.length){const cell=element(body.insertRow(),'td','Все сотрудники распределены');cell.colSpan=2;}
  }
  requestAnimationFrame(()=>{
    main.append(pending);
    for(const {slot,select} of assignmentInputs){
      const owner=select.closest('.card');
      if(!('matched' in owner.dataset))owner.dataset.matched=String(owner.classList.contains('retained'));
      select.addEventListener('change',()=>{
        if(select.value)selected.set(slot.id,select.value);else selected.delete(slot.id);
        try{localStorage.setItem(storageKey,JSON.stringify(Object.fromEntries(selected)));}catch{}
        refresh();
      });
    }
    refresh();
  });
}
if(mode==='compare'||mode==='platonov'){
    function reporting(item){
    const children=(item.children||[]).map(reporting);
    const lead=children.find(x=>/^(Директор по |Главный бухгалтер$|Начальник (ПДО|отдела|цеха|бюро|складского комплекса)$|Мастер участка(?:$| \()|Главный (механик|технолог)$)/.test(x.title));
    return {...item,children:lead?[{...lead,children:children.filter(x=>x!==lead)}]:children};
  }
  const [admin,...branches]=project.children;
  const chief=admin.children.find(x=>x.title==='Генеральный директор');
  const top=main.appendChild(card(chief,true));top.classList.add('reporting-root','root');
  const grid=main.appendChild(document.createElement('div'));grid.className='draft-grid';grid.style.setProperty('--tone','#8663ba');
  const columns=[{...admin,children:admin.children.filter(x=>x!==chief)},...branches.map(reporting)];
  const lanes=columns.map((item,index)=>{
    const lane=grid.appendChild(document.createElement('div'));
    lane.style.setProperty('--tone',colors[index%colors.length]);
    lane.append(node(item));return lane;
  });
  const links=document.createElementNS(svg.namespaceURI,'svg');
  links.classList.add('wires');links.setAttribute('aria-hidden','true');grid.prepend(links);
  function draw(){
    const bounds=grid.getBoundingClientRect();
    const center=el=>{const r=el.getBoundingClientRect();return r.left+r.width/2-bounds.left;};
    const xs=lanes.map(center);
    links.setAttribute('width',grid.scrollWidth);links.setAttribute('height',70);
    const line=document.createElementNS(svg.namespaceURI,'path');
    line.setAttribute('d',`M ${center(top)} 0 V 34 M ${xs[0]} 34 H ${xs.at(-1)} `+xs.map(x=>`M ${x} 34 V 68`).join(' '));
    line.setAttribute('fill','none');line.setAttribute('stroke','#548487');line.setAttribute('stroke-width','2');
    links.replaceChildren(line);
  }
  draw();new ResizeObserver(draw).observe(grid);

}
wires();new ResizeObserver(wires).observe(tree);addEventListener('beforeprint',wires);
</script></html>
