      select.closest('.card').classList.toggle('retained',Boolean(select.closest('.card').querySelector('select option:checked:not([value=""]):not([value="__vacancy__"])'))||select.closest('.card').dataset.matched==='true');
    }
    body.replaceChildren();
    for(const [name,title] of entries.filter(([name])=>!taken.has(name)&&!matchedNames.has(name)).filter(([name,title])=>(name+' '+title).toLowerCase().includes(search.value.trim().toLowerCase())).sort(([a],[b])=>a.localeCompare(b,'ru'))){
      const row=body.insertRow();element(row,'td',name);element(row,'td',title);
    }
    if(!body.rows.length){const cell=element(body.insertRow(),'td',search.value.trim()?'Нет совпадений':'Все сотрудники распределены');cell.colSpan=2;}
  }
  requestAnimationFrame(()=>{
    main.append(pending);
    for(const {slot,select} of assignmentInputs){
      const owner=select.closest('.card');
      if(!('matched' in owner.dataset))owner.dataset.matched=String(owner.classList.contains('retained'));
      select.addEventListener('change',()=>{
        if(select.value)selected.set(slot.id,select.value);else selected.delete(slot.id);
        try{localStorage.setItem(storageKey,JSON.stringify(Object.fromEntries(selected)));}catch{}
        refresh();
      });
    }
    refresh();
  });
}

    line.setAttribute('fill','none');line.setAttribute('stroke','#a4b3c3');line.setAttribute('stroke-width','2');

  }

}

}

function exportSnapshot(){
  const title=mode==='compare'?'Смешанная штатка':mode==='platonov'?'Предложенная штатка':'Основная штатка';
  const picked=new Map(assignmentInputs.map(({slot,select})=>[slot.id,select.value]));
  let source=data;
  if(mode==='compare'||mode==='platonov'){
    const [admin,...branches]=project.children;
    const chief=admin.children.find(item=>item.title==='Генеральный директор');
    source={...chief,children:[
      {...admin,children:admin.children.filter(item=>item!==chief)},
      ...branches.map(reporting)
    ]};
  }
  const rows=[];
  function visit(item,code,path=[]){
    const detailUnits=item.detail?.match(/^([\d.]+) шт\. ед\./)?.[1];
    const units=item.units??(detailUnits===undefined?null:Number(detailUnits));
    const names=[...(item.names||[])];
    let vacancy=0,undecided=0;
    for(const slot of item.assignmentSlots||[]){
      const value=picked.get(slot.id);
      if(value==='__vacancy__')vacancy++;
      else if(value)names.push(value);
      else undecided++;
    }
    const statuses=[];
    if(names.length)statuses.push('Назначено людей — '+names.length);
    if(vacancy)statuses.push('Вакансия — '+vacancy);
    if(undecided)statuses.push('Без решения — '+undecided);
    if(units!==null&&!names.length&&!item.assignmentSlots?.length)statuses.push('ФИО не указаны');
    const budget=item.budget&&item.budget!=='не утверждён'?Number(item.budget.replaceAll(' ','').replace(',','.')):null;
    rows.push({code,title:item.title,parent:path.join(' → '),depth:path.length,
      units,employees:names.join('\n'),status:statuses.join('\n'),budget,
      group:units===null});
    (item.children||[]).forEach((child,index)=>visit(child,code+'.'+(index+1),[...path,item.title]));
  }
  visit(source,'1');
  const totals=[...document.querySelectorAll('.staff-counts>div')].map(item=>[
    item.firstChild.textContent.trim(),item.querySelector('strong').textContent
  ]);
  const date=new Date().toLocaleString('ru-RU',{timeZone:'Europe/Moscow'});
  return {title,rows,totals,date:date+' (Москва)',filename:'Лабораттория — '+title};
}
const exportBar=element(controls,'div','');exportBar.className='export-actions';
const exportMessage=element(controls,'span','');exportMessage.className='export-message';
exportMessage.setAttribute('role','status');
for(const [format,label] of [['xlsx','Excel'],['pdf','PDF']]){
  const button=element(exportBar,'button',label);button.type='button';
  button.setAttribute('aria-label','Скачать '+label);
  button.addEventListener('click',async()=>{
    const snapshot=exportSnapshot();
    exportBar.querySelectorAll('button').forEach(item=>item.disabled=true);
    exportMessage.textContent='Готовлю файл…';
    try{
      await window.staffingExport(format,snapshot);
      exportMessage.textContent='Файл готов';
    }catch(error){
      exportMessage.textContent='Выгрузка не выполнена. Повторите попытку.';
      console.error(error);
    }finally{
      exportBar.querySelectorAll('button').forEach(item=>item.disabled=false);
    }
  });
}
