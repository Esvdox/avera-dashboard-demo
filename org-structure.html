*{box-sizing:border-box}html{background:#d5dde1}body{margin:0;font:16px Arial,sans-serif;color:#25445a}

h1{position:absolute;margin:0;color:#fff;font-size:23px;font-weight:400;line-height:1.18}
h1 span{display:block;letter-spacing:.2em;text-transform:uppercase;font-size:18px;margin-bottom:6px}
.card{position:relative;display:flex;align-items:center;gap:12px;min-width:0;padding:14px;border:2px solid #fff9;border-radius:9px;background:linear-gradient(135deg,#fff9,#f8fafbd9 58%,#e1e5e8);box-shadow:0 9px 13px #233b4a30,inset 0 1px 2px #fff;overflow-wrap:anywhere}

.lane{position:relative;min-width:0}.lane>.node+.node{margin-top:22px}
.node{position:relative;min-width:0}.node>.card::before,.root::after{content:"";position:absolute;z-index:2;top:-6px;left:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:var(--tone,#358785);box-shadow:0 0 0 2px color-mix(in srgb,var(--tone,#358785) 25%,transparent)}
.root::after{top:auto;bottom:-6px}
.children{position:relative;display:grid;gap:12px;margin-top:14px;padding-left:16px;border-left:2px dotted var(--tone)}
.children>.node>.card::before{left:-20px;top:calc(50% - 4px);width:7px;height:7px}
.children>.node>.card{padding:9px 10px;border-radius:8px;font-size:.91em}
.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}

.card.proposed{border-color:#e5b166;background:#fff4df}.card .proposal{color:#864100;font-weight:bold}.card a{color:inherit}.card.platonov{background:#e5ddfa;border-color:#ad92e1}.draft-controls{position:relative;margin:22px auto 0;text-align:center}.draft-controls button{padding:8px 16px;border:1px solid #ad92e1;border-radius:8px;background:#e5ddfa;color:#392365;cursor:pointer}.draft{margin:20px auto 0;max-width:1750px}.draft-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:16px;align-items:start}[hidden]{display:none!important}</style>
